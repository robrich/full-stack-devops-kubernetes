name: FullStack PR build

on:
  push:
    branches:
    - '!main'
  pull_request:
    branches:
    - '**'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      - uses: actions/checkout@v4

      - name: Docker build & push, kubectl apply
        run: |
          set -x
          cd api
          docker build -t fullstack-api:${{ github.sha }} .
          cd ..
          cd app
          docker build -t fullstack-app:${{ github.sha }} .
          cd ..
          # run integration tests here
